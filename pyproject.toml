[project]
name = "brillouin-imaging"
dynamic = ["version"]
description = "A plugin to work with brim files, which contain Brillouin imaging data"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
  {name = "Carlo Bevilacqua"},
  {email = "carlo.bevilacqua@embl.de"},
  {name = "Markus Körbel"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: File Formats",
    "Topic :: Scientific/Engineering",
]
keywords = ["Brillouin imaging", "brimfile"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "magicgui",
    "qtpy",
    "brimfile[remote-store]>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
]

[dependency-groups]
dev = [
    "tox-uv",  # lets `tox`/`uv run tox` use uv as its testenv backend locally; CI's `uvx --with tox-gh-actions tox` doesn't request it, so it has no effect there
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[all]",
    "matplotlib",  # required to exercise SpectraTools plotting code paths
]

[project.urls]
Repository = "https://github.com/brillouin-imaging/brillouin-imaging-napari"
Issues = "https://github.com/brillouin-imaging/brillouin-imaging-napari/issues"

[project.entry-points."napari.manifest"]
brillouin-imaging = "brillouin_imaging:napari.yaml"


[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]


[tool.setuptools_scm]
write_to = "src/brillouin_imaging/_version.py"
fallback_version = "0.0.1+nogit"


[tool.uv]
# Read automatically by astral-sh/setup-uv in CI (and by `uv` locally) when
# no explicit `version:` input/flag is given, so the uv version used in CI
# and by contributors stays in sync from one place instead of being
# hardcoded separately in .github/workflows/test.yml.
# https://docs.astral.sh/uv/reference/settings/#required-version
required-version = ">=0.8"


[tool.black]
line-length = 79
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
    "SIM117", # flake8-simplify - some of merged with statements are not looking great with black, reanble after drop python 3.9
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

target-version = "py311"
fix = true